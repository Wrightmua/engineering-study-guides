<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CEC304 — Introduction to Cryptography</title>
<style>
  :root{
    --paper:#f7f3ea;
    --ink:#1f2421;
    --ink-soft:#4a504c;
    --rule:#cfc6b0;
    --accent:#9a3324;       /* brick red, echoes the slide-deck red headers */
    --accent-soft:#c8714f;
    --green:#3c6b50;        /* used for "correct" */
    --green-bg:#e7efe5;
    --wrong:#9a3324;
    --wrong-bg:#f3e4df;
    --mono-bg:#efe9da;
    --card:#fffdf8;
    --shadow: 0 2px 0 rgba(31,36,33,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    line-height:1.55;
    padding:0 0 80px 0;
  }
  .wrap{max-width:880px;margin:0 auto;padding:36px 24px 0 24px;}

  /* ---------- Header / nav ---------- */
  .masthead{
    border-bottom:3px double var(--ink);
    padding-bottom:14px;
    margin-bottom:6px;
  }
  .masthead .kicker{
    font-family: "Courier New", monospace;
    letter-spacing:0.12em;
    font-size:12px;
    text-transform:uppercase;
    color:var(--accent);
  }
  .masthead h1{
    font-size:30px;
    margin:4px 0 2px 0;
    font-weight:600;
  }
  .masthead .sub{
    color:var(--ink-soft);
    font-size:14.5px;
    font-style:italic;
  }

  .progress-row{
    display:flex; align-items:center; gap:10px;
    margin:14px 0 18px 0;
    font-family:"Courier New",monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .progress-track{
    flex:1; height:6px; background:var(--rule); border-radius:3px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:var(--accent); width:0%;
    transition:width .4s ease;
  }

  nav.toc{
    display:flex; flex-wrap:wrap; gap:6px 10px;
    margin-bottom:28px;
    font-family:"Courier New",monospace;
    font-size:12px;
  }
  nav.toc button{
    background:var(--card);
    border:1px solid var(--rule);
    color:var(--ink-soft);
    padding:5px 10px;
    border-radius:3px;
    cursor:pointer;
    font-family:inherit;
    font-size:12px;
  }
  nav.toc button.active{
    border-color:var(--accent);
    color:var(--accent);
    font-weight:700;
  }
  nav.toc button:hover{ color:var(--accent); }

  /* ---------- Section ---------- */
  section.module{ display:none; }
  section.module.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .module h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--accent);
    border-bottom:1px solid var(--rule);
    padding-bottom:8px;
    margin:34px 0 16px 0;
  }
  .module h2 .num{
    display:inline-block;
    background:var(--accent);
    color:var(--paper);
    width:20px;height:20px;
    text-align:center;
    line-height:20px;
    border-radius:50%;
    font-size:11px;
    margin-right:8px;
  }
  .module h3{
    font-size:17px;
    margin:22px 0 8px 0;
    color:var(--ink);
  }
  .module p{ margin:8px 0; }
  .module ul, .module ol{ margin:8px 0; padding-left:22px; }
  .module li{ margin:4px 0; }

  .intuition{
    background:var(--card);
    border-left:3px solid var(--accent-soft);
    padding:12px 16px;
    margin:14px 0;
    border-radius:0 4px 4px 0;
    font-size:15px;
  }
  .intuition .tag{
    font-family:"Courier New",monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent-soft);
    display:block;
    margin-bottom:4px;
  }

  .math{
    background:var(--mono-bg);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:10px 14px;
    font-family:"Cambria Math","Georgia",serif;
    font-size:16px;
    text-align:center;
    margin:10px 0;
  }
  .mono{
    font-family:"Courier New",monospace;
    background:var(--mono-bg);
    padding:1px 5px;
    border-radius:3px;
    font-size:0.92em;
  }

  table.refs{
    border-collapse:collapse;
    width:100%;
    margin:10px 0;
    font-size:14px;
  }
  table.refs th, table.refs td{
    border:1px solid var(--rule);
    padding:5px 8px;
    text-align:center;
  }
  table.refs th{ background:var(--mono-bg); }

  .flag{
    background:#f6ecdf;
    border:1px solid #d8c190;
    border-left:3px solid #b8893a;
    padding:10px 14px;
    margin:14px 0;
    border-radius:0 4px 4px 0;
    font-size:14px;
  }
  .flag .tag{
    font-family:"Courier New",monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#9a6c1f;
    display:block;
    margin-bottom:3px;
  }

  /* ---------- Question cards ---------- */
  .qcard{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:16px 18px;
    margin:18px 0;
    box-shadow:var(--shadow);
  }
  .qcard .qlabel{
    font-family:"Courier New",monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
  }
  .qcard .qtext{ font-size:15.5px; margin-bottom:10px; }
  .opts{ display:flex; flex-direction:column; gap:7px; }
  .opt{
    text-align:left;
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:8px 12px;
    cursor:pointer;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    transition:background .15s, border-color .15s;
  }
  .opt:hover{ border-color:var(--accent-soft); }
  .opt.correct{ background:var(--green-bg); border-color:var(--green); color:#234032; font-weight:600;}
  .opt.wrong{ background:var(--wrong-bg); border-color:var(--wrong); color:#6b231a; }
  .opt:disabled{ cursor:default; }

  .feedback{
    margin-top:10px;
    padding:9px 12px;
    border-radius:4px;
    font-size:14px;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.good{ background:var(--green-bg); color:#234032; border:1px solid var(--green); }
  .feedback.bad{ background:var(--wrong-bg); color:#6b231a; border:1px solid var(--wrong); }

  /* numeric-entry question */
  .numrow{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .numrow input[type=text]{
    font-family:"Courier New",monospace;
    font-size:14.5px;
    padding:7px 10px;
    border:1px solid var(--rule);
    border-radius:4px;
    width:140px;
    background:var(--paper);
  }
  .numrow button{
    font-family:"Courier New",monospace;
    font-size:12.5px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:8px 14px;
    border-radius:4px;
    cursor:pointer;
  }
  .numrow button:hover{ background:var(--accent); }
  .numrow .reveal-btn{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--rule);
  }
  .numrow .reveal-btn:hover{ color:var(--accent); border-color:var(--accent-soft); background:transparent;}

  details.solution{
    margin-top:10px;
    font-size:14px;
    background:var(--mono-bg);
    border-radius:4px;
    padding:6px 12px;
  }
  details.solution summary{
    cursor:pointer;
    font-family:"Courier New",monospace;
    font-size:12px;
    color:var(--ink-soft);
    padding:4px 0;
  }
  details.solution[open] summary{ color:var(--accent); }
  details.solution .sol-body{ padding:6px 2px 8px 2px; }

  /* drag/order question (used in practice section) */
  .order-list{ list-style:none; padding:0; margin:10px 0; display:flex; flex-direction:column; gap:6px;}
  .order-list li{
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:7px 10px;
    cursor:grab;
    font-size:14px;
    font-family:"Courier New",monospace;
  }
  .order-list li.dragging{ opacity:0.4; }
  .order-list li.placed-correct{ border-color:var(--green); background:var(--green-bg); }

  /* ---------- footer nav buttons ---------- */
  .stepnav{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:34px; padding-top:14px; border-top:1px solid var(--rule);
  }
  .stepnav button{
    font-family:"Courier New",monospace;
    font-size:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:9px 16px;
    border-radius:4px;
    cursor:pointer;
  }
  .stepnav button:disabled{ opacity:0.3; cursor:default; }
  .stepnav button:not(:disabled):hover{ background:var(--accent); }
  .stepnav .midlabel{ font-family:"Courier New",monospace; font-size:11px; color:var(--ink-soft); }

  .score-pill{
    display:inline-block;
    font-family:"Courier New",monospace;
    font-size:11px;
    background:var(--mono-bg);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:2px 10px;
    color:var(--ink-soft);
  }

  /* final summary panel */
  .summary-panel{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:20px;
    margin-top:18px;
    text-align:center;
  }
  .summary-panel .big{
    font-size:38px;
    color:var(--accent);
    font-weight:700;
  }
  .reset-btn{
    margin-top:10px;
    font-family:"Courier New",monospace;
    font-size:12px;
    background:transparent;
    border:1px solid var(--rule);
    color:var(--ink-soft);
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
  }
  .reset-btn:hover{ color:var(--accent); border-color:var(--accent-soft); }

  ::selection{ background:#e3c8b8; }

  @media (max-width:560px){
    .wrap{ padding:24px 14px 0 14px; }
    .masthead h1{ font-size:24px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <span class="kicker">CEC304 · Interactive Study Companion</span>
    <h1>Introduction to Cryptography</h1>
    <div class="sub">Definitions &amp; cryptanalysis · substitution ciphers · divisibility &amp; GCD · modular arithmetic · elliptic curves</div>
  </div>

  <div class="progress-row">
    <span id="progress-label">Section 1 of 7</span>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="score-pill" id="score-pill">score 0 / 0</span>
  </div>

  <nav class="toc" id="toc"></nav>

  <div id="modules-host"></div>

  <div class="stepnav">
    <button id="prevBtn">&larr; back</button>
    <span class="midlabel" id="midlabel"></span>
    <button id="nextBtn">next &rarr;</button>
  </div>

</div>

<script>
/* =====================================================================
   QUESTION ENGINE
   Each question type renders itself and reports into a shared score
   tracker keyed by a unique id, so re-visiting a section doesn't
   double count, and the progress bar / score pill reflect real state.
===================================================================== */

const SCORE = { answered: {}, correct: {} }; // keyed by question id -> bool

function totalScore(){
  const ids = Object.keys(SCORE.answered);
  const correct = ids.filter(id => SCORE.correct[id]).length;
  return { correct, total: ids.length };
}

function refreshScorePill(){
  const { correct, total } = totalScore();
  document.getElementById('score-pill').textContent = `score ${correct} / ${total}`;
}

/* ---- Multiple choice ---- */
function renderMCQ(container, q){
  // q = {id, label, text, options:[{text, correct, why}], }
  const card = document.createElement('div');
  card.className = 'qcard';
  card.innerHTML = `
    <div class="qlabel"><span>${q.label}</span><span>multiple choice</span></div>
    <div class="qtext">${q.text}</div>
    <div class="opts"></div>
    <div class="feedback"></div>
  `;
  const optsHost = card.querySelector('.opts');
  const fb = card.querySelector('.feedback');

  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt.text;
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      // lock all
      [...optsHost.children].forEach(b => b.disabled = true);
      if (opt.correct){
        btn.classList.add('correct');
        fb.className = 'feedback show good';
        fb.textContent = '✓ Correct. ' + (opt.why || '');
        SCORE.correct[q.id] = true;
      } else {
        btn.classList.add('wrong');
        fb.className = 'feedback show bad';
        fb.textContent = '✗ Not quite. ' + (opt.why || '');
        SCORE.correct[q.id] = false;
        // reveal correct one
        const correctIdx = q.options.findIndex(o => o.correct);
        if (correctIdx > -1) optsHost.children[correctIdx].classList.add('correct');
      }
      SCORE.answered[q.id] = true;
      refreshScorePill();
    });
    optsHost.appendChild(btn);
  });

  container.appendChild(card);
}

/* ---- Numeric entry ---- */
function renderNumeric(container, q){
  // q = {id, label, text, accept: [array of acceptable strings, normalized], hint, solution}
  const card = document.createElement('div');
  card.className = 'qcard';
  card.innerHTML = `
    <div class="qlabel"><span>${q.label}</span><span>your answer</span></div>
    <div class="qtext">${q.text}</div>
    <div class="numrow">
      <input type="text" placeholder="${q.placeholder || 'type your answer'}" />
      <button class="check-btn">check</button>
      <button class="reveal-btn">show solution</button>
    </div>
    <div class="feedback"></div>
    ${q.solution ? `<details class="solution"><summary>Worked solution</summary><div class="sol-body">${q.solution}</div></details>` : ''}
  `;
  const input = card.querySelector('input');
  const checkBtn = card.querySelector('.check-btn');
  const revealBtn = card.querySelector('.reveal-btn');
  const fb = card.querySelector('.feedback');
  const details = card.querySelector('details.solution');

  function normalize(s){
    return s.trim().toLowerCase().replace(/\s+/g,'').replace(/^\(|\)$/g,'');
  }

  checkBtn.addEventListener('click', () => {
    const val = normalize(input.value);
    if (!val){
      fb.className = 'feedback show bad';
      fb.textContent = 'Type an answer first.';
      return;
    }
    const ok = q.accept.some(a => normalize(a) === val);
    SCORE.answered[q.id] = true;
    SCORE.correct[q.id] = ok;
    if (ok){
      fb.className = 'feedback show good';
      fb.textContent = '✓ Correct.' + (q.confirm ? ' ' + q.confirm : '');
    } else {
      fb.className = 'feedback show bad';
      fb.textContent = '✗ Not yet — try again, or open the worked solution below.';
    }
    refreshScorePill();
  });

  revealBtn.addEventListener('click', () => {
    if (details) details.open = true;
  });

  input.addEventListener('keydown', e => { if (e.key === 'Enter') checkBtn.click(); });

  container.appendChild(card);
}

/* ---- True / False quick-check ---- */
function renderTF(container, q){
  renderMCQ(container, {
    id:q.id, label:q.label, text:q.text,
    options:[
      {text:'True', correct:q.answer===true, why:q.why},
      {text:'False', correct:q.answer===false, why:q.why}
    ]
  });
}

/* ---- Fill-in worked-step (sequence of small numeric blanks) ---- */
function renderSteps(container, q){
  // q = {id, label, text, steps:[{prompt, accept:[...]}], solution}
  const card = document.createElement('div');
  card.className = 'qcard';
  card.innerHTML = `
    <div class="qlabel"><span>${q.label}</span><span>step-through</span></div>
    <div class="qtext">${q.text}</div>
    <div class="steps-host"></div>
    ${q.solution ? `<details class="solution"><summary>Full worked solution</summary><div class="sol-body">${q.solution}</div></details>` : ''}
  `;
  const host = card.querySelector('.steps-host');

  q.steps.forEach((st, i) => {
    const row = document.createElement('div');
    row.className = 'numrow';
    row.style.margin = '8px 0';
    row.innerHTML = `
      <span style="font-size:14px;min-width:160px;">${st.prompt}</span>
      <input type="text" style="width:110px"/>
      <button class="check-btn">check</button>
      <span class="step-fb" style="font-family:'Courier New',monospace;font-size:12px;"></span>
    `;
    const input = row.querySelector('input');
    const btn = row.querySelector('.check-btn');
    const fb = row.querySelector('.step-fb');
    const stepId = q.id + '-step' + i;

    function normalize(s){ return s.trim().toLowerCase().replace(/\s+/g,''); }

    btn.addEventListener('click', () => {
      const val = normalize(input.value);
      const ok = st.accept.some(a => normalize(a) === val);
      SCORE.answered[stepId] = true;
      SCORE.correct[stepId] = ok;
      fb.textContent = ok ? '✓' : '✗';
      fb.style.color = ok ? 'var(--green)' : 'var(--wrong)';
      refreshScorePill();
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });

    host.appendChild(row);
  });

  container.appendChild(card);
}

/* =====================================================================
   CONTENT — one object per module (section). Each module has:
   - id, title
   - bodyHTML: the teaching prose (kept tight; full depth lives in chat)
   - questions: array of {type, ...}
===================================================================== */

const MODULES = [

/* ---------------- 0: Welcome ---------------- */
{
  id:'intro', title:'Start here',
  bodyHTML:`
    <h2><span class="num">0</span>Before you begin</h2>
    <p>This is a self-check companion to the full walkthrough — it follows your notes in the same order:
    definitions &amp; cryptanalysis → substitution ciphers → divisibility &amp; GCD → modular arithmetic → elliptic curve arithmetic →
    a final practice set.</p>
    <p>Each section has a short refresher, then questions that check whether the <em>intuition</em> actually landed —
    not just whether you can recite a formula. Numeric questions accept your typed answer and let you peek at a full
    worked solution if you get stuck. Nothing here is timed.</p>
    <div class="intuition"><span class="tag">how to use it</span>
    Work top to bottom within a section before moving on — later sections lean on earlier ones constantly
    (GCD feeds modular inverses; modular inverses feed elliptic curve arithmetic over finite fields).</div>
  `,
  questions: []
},

/* ---------------- 1: Definitions & basic principles ---------------- */
{
  id:'defs', title:'1 · Definitions',
  bodyHTML:`
    <h2><span class="num">1</span>Definitions and Basic Principles</h2>
    <p>The whole field rests on one diagram: a <strong>plaintext</strong> P goes through <strong>encryption</strong> under a
    secret <strong>key</strong> K to become <strong>ciphertext</strong> C; the same key lets the intended recipient run
    <strong>decryption</strong> to recover P.</p>
    <div class="math">E<sub>K</sub>(P) = C &nbsp;&nbsp;&nbsp; D<sub>K</sub>(C) = P</div>
    <div class="intuition"><span class="tag">core idea</span>
    The <em>algorithm</em> can be public. Secrecy lives entirely in the key — this is the seed of Kerckhoffs's
    Principle, coming up in Section 2.</div>
    <p><strong>Cryptology</strong> splits into two adversarial halves: <strong>cryptography</strong> (building secure
    systems) and <strong>cryptanalysis</strong> (breaking them). Your notes are explicit that modern cryptologists
    need real theoretical mathematics — which is exactly why the notes pivot into number theory next.</p>
  `,
  questions:[
    { type:'mcq', id:'d1', label:'Q1',
      text:'In E<sub>K</sub>(P) = C, what does the subscript K represent?',
      options:[
        {text:'The ciphertext length', correct:false, why:'Length isn\'t part of this notation at all.'},
        {text:'The secret key controlling the encryption function', correct:true, why:'Both encryption and decryption are parameterized by the same key K.'},
        {text:'The keyspace size', correct:false, why:'Keyspace size is a separate concept — the count of possible keys, not a specific key.'},
        {text:'The cipher\'s name', correct:false, why:'K is a value, not a label for the algorithm.'}
      ]
    },
    { type:'tf', id:'d2', label:'Q2',
      text:'True or false: in a well-designed modern cryptosystem, the encryption algorithm itself should also be kept secret for the system to be secure.',
      answer:false,
      why:'This is the opposite of Kerckhoffs\'s Principle (Section 2): security should rest on the key alone, not on hiding the algorithm.'
    },
    { type:'mcq', id:'d3', label:'Q3',
      text:'Which pairing correctly matches the two branches of cryptology to their definitions?',
      options:[
        {text:'Cryptography = breaking ciphertext; Cryptanalysis = keeping messages secure', correct:false, why:'This is reversed.'},
        {text:'Cryptography = keeping messages secure; Cryptanalysis = breaking ciphertext', correct:true, why:'Exactly as your notes\' tree diagram on page 4 shows.'},
        {text:'Both terms mean the same thing', correct:false, why:'They\'re explicitly opposite, adversarial halves of the field.'},
        {text:'Cryptography only applies to historical ciphers', correct:false, why:'Cryptography covers all secure-system design, historical and modern.'}
      ]
    }
  ]
},

/* ---------------- 2: Cryptanalysis ---------------- */
{
  id:'cryptanalysis', title:'2 · Cryptanalysis',
  bodyHTML:`
    <h2><span class="num">2</span>Cryptanalysis</h2>
    <div class="intuition"><span class="tag">core idea — Kerckhoffs's Principle</span>
    "The security of a cipher should rely on the secrecy of the key only." If the algorithm leaks (and eventually,
    it will), the system should still be safe — because only the key needs to change.</div>
    <p>The standard attacker model assumes the worst case: the attacker knows the full algorithm, has the
    encryption/decryption equipment, and has arbitrarily many plaintext/ciphertext pairs from the same key.
    Given that, a <strong>strong cipher</strong> is one where the best possible attack is still brute-force key search.</p>
    <p>Attacks are ranked by how much access the attacker gets:</p>
    <table class="refs">
      <tr><th>Attack type</th><th>Attacker has…</th></tr>
      <tr><td>Ciphertext-only</td><td>only ciphertext (weakest attacker)</td></tr>
      <tr><td>Known-plaintext</td><td>matched plaintext/ciphertext pairs</td></tr>
      <tr><td>Chosen-plaintext</td><td>can choose plaintext to encrypt</td></tr>
      <tr><td>Adaptive chosen-plaintext</td><td>chooses a series, each informed by the last result (→ differential cryptanalysis)</td></tr>
    </table>
  `,
  questions:[
    { type:'mcq', id:'c1', label:'Q1',
      text:'Which attack type gives the attacker the LEAST power?',
      options:[
        {text:'Adaptive chosen-plaintext', correct:false, why:'This is the strongest attacker, not the weakest.'},
        {text:'Chosen-plaintext', correct:false, why:'The attacker actively picks plaintexts here — more power than ciphertext-only.'},
        {text:'Ciphertext-only', correct:true, why:'Right — the attacker only ever sees ciphertext, with no plaintext access at all.'},

    <div class="intuition"><span class="tag">core idea</span>
    Addition in ℤₙ always has an inverse (y = n−x always works). Multiplication does NOT — and whether x has a
    multiplicative inverse mod n comes down entirely to gcd(x,n) = 1. This is where Section 4's work pays off directly.</div>
    <div class="math">x has a multiplicative inverse in ℤₙ &nbsp;⟺&nbsp; gcd(x, n) = 1</div>
    <p>Special case: if <strong>n is prime</strong>, every nonzero x automatically satisfies gcd(x,n)=1, so
    <em>every</em> nonzero element is invertible. This is exactly why elliptic curve cryptography (Section 6) insists
    on a prime field size.</p>
    <p>Your notes' contrast: in ℤ₁₁ (prime), every nonzero element has an inverse. In ℤ₉ (not prime, 9=3×3),
    elements 3 and 6 have <em>no</em> inverse — because gcd(3,9)=3 and gcd(6,9)=3, neither is 1.</p>
    <p><strong>Euler's totient φ(n)</strong> counts how many integers ≤ n are relatively prime to n. For n=7 (prime),
    φ(7)=6 — and in general, for prime n, φ(n) = n − 1.</p>

/* =====================================================================
   RENDER ENGINE
===================================================================== */
const host = document.getElementById('modules-host');
const tocHost = document.getElementById('toc');
let currentIdx = 0;

MODULES.forEach((m, i) => {
  const sec = document.createElement('section');
  sec.className = 'module';
  sec.id = 'mod-' + m.id;
  sec.innerHTML = m.bodyHTML;

  if (m.questions && m.questions.length){
    const qHost = document.createElement('div');
    qHost.className = 'qhost';
    m.questions.forEach(q => {
      if (q.type === 'mcq') renderMCQ(qHost, q);
      else if (q.type === 'numeric') renderNumeric(qHost, q);
      else if (q.type === 'tf') renderTF(qHost, q);
      else if (q.type === 'steps') renderSteps(qHost, q);
    });
    sec.appendChild(qHost);
  }

  host.appendChild(sec);

  const tbtn = document.createElement('button');
  tbtn.textContent = m.title;
  tbtn.addEventListener('click', () => goTo(i));
  tocHost.appendChild(tbtn);
});

function goTo(idx){
  currentIdx = Math.max(0, Math.min(MODULES.length - 1, idx));
  document.querySelectorAll('section.module').forEach((s,i) => {
    s.classList.toggle('active', i === currentIdx);
  });
  [...tocHost.children].forEach((b,i) => b.classList.toggle('active', i === currentIdx));
  document.getElementById('progress-label').textContent = `Section ${currentIdx+1} of ${MODULES.length}`;
  document.getElementById('progress-fill').style.width = (100*(currentIdx+1)/MODULES.length) + '%';
  document.getElementById('prevBtn').disabled = currentIdx === 0;
  const isLast = currentIdx === MODULES.length - 1;
  document.getElementById('nextBtn').textContent = isLast ? 'finish ✓' : 'next →';
  document.getElementById('midlabel').textContent = MODULES[currentIdx].title;
  window.scrollTo({top:0, behavior:'smooth'});
  refreshScorePill();
}

document.getElementById('prevBtn').addEventListener('click', () => goTo(currentIdx - 1));
document.getElementById('nextBtn').addEventListener('click', () => {
  if (currentIdx === MODULES.length - 1){
    showFinalSummary();
  } else {
    goTo(currentIdx + 1);
  }
});

function showFinalSummary(){
  const { correct, total } = totalScore();
  const pct = total ? Math.round(100*correct/total) : 0;
  let msg;
  if (pct >= 85) msg = "Strong grasp across the board — this material is solid.";
  else if (pct >= 60) msg = "Good progress. Revisit the flagged misses before the exam.";
  else msg = "Worth another pass through the sections where you missed questions.";

  const panel = document.createElement('div');
  panel.className = 'summary-panel';
  panel.innerHTML = `
    <div class="big">${correct} / ${total}</div>
    <p>${msg}</p>
    <button class="reset-btn" id="resetAll">reset all answers</button>
  `;
  const old = document.getElementById('finalPanel');
  if (old) old.remove();
  panel.id = 'finalPanel';
  document.querySelector('.wrap').appendChild(panel);
  panel.scrollIntoView({behavior:'smooth'});

  document.getElementById('resetAll').addEventListener('click', () => {
    location.reload();
  });
}

goTo(0);
</script>
