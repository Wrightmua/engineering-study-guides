<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CEC318 — Exam Paper Study Guide</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e2229;
    --line:#2a2f3a; --text:#e8eaed; --muted:#9aa2b1;
    --accent:#5eb0ff; --good:#3ecf8e; --bad:#ff6b6b; --warn:#f5c451;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
  header{padding:22px 20px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  header h1{margin:0 0 4px;font-size:1.25rem;letter-spacing:.2px}
  header p{margin:0;color:var(--muted);font-size:.85rem}
  nav{display:flex;gap:6px;padding:12px 20px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel)}
  nav button{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:20px;font-size:.82rem;cursor:pointer;white-space:nowrap}
  nav button.active{background:var(--accent);color:#08111c;border-color:var(--accent);font-weight:600}
  main{max-width:720px;margin:0 auto;padding:18px 16px 80px}
  section{display:none}
  section.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{margin:0 0 10px;font-size:1.02rem;color:var(--accent)}
  .card h3{margin:14px 0 6px;font-size:.92rem;color:var(--text)}
  .card p, .card li{color:#cdd2dc;font-size:.9rem}
  .card ul{margin:6px 0;padding-left:20px}
  .src{display:inline-block;background:rgba(94,176,255,.12);border:1px solid #2c4460;color:var(--accent);font-size:.68rem;padding:2px 8px;border-radius:8px;margin-bottom:8px}
  .lifecycle{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .lc-node{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.82rem;flex:1 1 40%;min-width:120px}
  .lc-node b{display:block;color:var(--accent);font-size:.85rem}
  .arch{display:grid;gap:8px;margin:10px 0}
  .arch-row{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
  .arch-row b{color:var(--warn)}
  code{background:#0c0e13;border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:.85em;color:#9fd4ff}
  pre{background:#0c0e13;border:1px solid var(--line);padding:12px;border-radius:10px;overflow-x:auto;font-size:.82rem}
  /* Flashcards */
  .flash-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  .flashcard{width:100%;max-width:520px;min-height:170px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:1rem;user-select:none}
  .flashcard .face{display:none}
  .flashcard .face.show{display:block}
  .flashcard .q{color:var(--text)}
  .flashcard .a{color:var(--good)}
  .flash-controls{display:flex;gap:10px;align-items:center}
  .flash-controls button{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:10px;font-size:.85rem;cursor:pointer}
  .flash-controls button:active{transform:scale(.97)}
  .flash-progress{color:var(--muted);font-size:.8rem}
  .hint{color:var(--muted);font-size:.78rem;margin-top:4px}
  .qsrc{color:var(--muted);font-size:.75rem;margin-bottom:2px}
  /* Quiz */
  .qprog{color:var(--muted);font-size:.8rem;margin-bottom:8px}
  .qtext{font-size:.98rem;margin:8px 0 14px;color:var(--text)}
  .opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:10px;margin-bottom:8px;font-size:.88rem;cursor:pointer}
  .opt:active{transform:scale(.99)}
  .opt.correct{border-color:var(--good);background:rgba(62,207,142,.12)}
  .opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.12)}
  .opt[disabled]{cursor:default}
  .explain{background:var(--panel2);border-left:3px solid var(--accent);padding:10px 12px;border-radius:8px;font-size:.85rem;color:#cdd2dc;margin-top:10px;display:none}
  .explain.show{display:block}
  .quiz-nav{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
  .quiz-nav button{flex:1;background:var(--accent);color:#08111c;border:none;padding:11px;border-radius:10px;font-weight:600;font-size:.88rem;cursor:pointer}
  .quiz-nav button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .quiz-nav button:disabled{opacity:.4}
  .score-box{text-align:center;padding:26px 16px}
  .score-box .big{font-size:2.2rem;font-weight:700;color:var(--accent)}
  .essay-outline li{margin-bottom:6px}
</style>
</head>
<body>

<header>
  <h1>CEC318 — Exam Paper Study Guide</h1>
  <p>Only content from your uploaded paper · Exam CEC318 2026</p>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<script>
const tabs = [
  {id:'notes', label:'📘 Paper Content'},
  {id:'flash', label:'🃏 Flashcards'},
  {id:'quiz', label:'✅ MCQ Quiz'},
  {id:'tf', label:'🔁 True/False'},
  {id:'essay', label:'✍️ Structured & Use Cases'},
];

// ---------------- DATA (every item traceable to the two paper images) ----------------

const flashcards = [
  {q:"Which of the following is NOT an advantage of a mobile app over a mobile website?", a:"Easier to update the content — that's actually a website advantage (updates instantly, no app-store cycle)."},
  {q:"When an app needs to upload data, what should it do?", a:"Cache the data and send it asynchronously (do not block user interaction or force the user to stay connected)."},
  {q:"How can an app reduce battery drain related to sensors and activity?", a:"Monitor whether a sensor reading actually needs an update before using the sensor, AND shut down all activity when the app is paused."},
  {q:"Proper lifecycle method to save app status — Android and iOS?", a:"Android: onPause. iOS: viewWillDisappear."},
  {q:"Difference between the Paused and Stopped states in the Android lifecycle", a:"In the Paused state, the user can see but not interact with the activity. In the Stopped state, the activity is not visible."},
  {q:"Is porting an existing application directly to mobile a good idea? (6.1)", a:"False — the paper states this should be considered false; direct porting doesn't suit mobile constraints."},
  {q:"Is vertical scrolling good for lists but should be limited for other element types? (6.2)", a:"True."},
  {q:"Is battery use a concern for all app developers? (6.3)", a:"False."},
  {q:"Are differences in hardware capabilities limited between devices? (6.4)", a:"False."},
  {q:"Is mobile usability typically worse than desktop? (6.5)", a:"False."},
  {q:"How many languages does the paper ask you to name for mobile app development, and for how many marks?", a:"3 languages, 3 marks (Exercise 2, Q1)."},
  {q:"How many cross-platform frameworks does the paper ask you to cite and describe, and for how many marks?", a:"3 platforms, 6 marks (Exercise 2, Q2)."},
  {q:"How many marks for briefly presenting the Android lifecycle?", a:"3 marks (Exercise 2, Q3)."},
  {q:"How many marks for presenting the Android Architecture?", a:"5 marks (Exercise 2, Q4)."},
  {q:"How many marks for explaining the principal constraints of mobile development?", a:"5 marks (Exercise 2, Q5)."},
  {q:"What does the paper ask regarding StatefulWidget vs StatelessWidget, and for how many marks?", a:"Explain the difference between them — 3 marks (Exercise 2, Q6)."},
  {q:"Which 4 Flutter widgets/methods does the paper ask you to explain the role of, and for how many marks?", a:"Scaffold(), runApp(), build(), FloatingActionButton() — 5 marks (Exercise 2, Q7)."},
  {q:"What is the total mark value of Part I: Comprehensive Questions?", a:"40 marks."},
  {q:"What is the total mark value of Exercise 1 (MCQ and True/False)?", a:"10 marks."},
  {q:"What is the total mark value of Exercise 2 (Structured Questions)?", a:"30 marks."},
  {q:"What is the total mark value of Part II: Use Cases?", a:"30 marks — Part II.A (Calculator, 10 marks) + Part II.B (Banking App essay, 20 marks)."},
  {q:"Part II.A — what class must the Dart program define, and how many marks for the constructor?", a:"A Calculator class with a constructor — 4 marks."},
  {q:"Part II.A — how should the user select an operation?", a:"By entering the corresponding number — 2 marks."},
  {q:"Part II.A — what must the program do before performing the operation?", a:"Ask the user to enter two numbers, choose an operation, and display the results — 2 marks."},
  {q:"Part II.A — what must main() do, and for how many marks?", a:"Instantiate a Calculator; the calculator keeps running until the user chooses Exit(5) — 4 marks (includes handling invalid menu options appropriately, 2 of those marks)."},
  {q:"Part II.B — what is the name of the project described in the Use Case?", a:"The Banking App."},
  {q:"Part II.B — what problem does the Banking App solve, per the paper's description?", a:"Traditional banking requires visiting physical branches to check balances, transfer money, or pay bills; the app lets users do these anytime, anywhere from their smartphones."},
  {q:"Part II.B — what four things must your technical essay describe?", a:"The app's core features, user interface (UI) structure, data management, and development workflow — for 20 marks."},
  {q:"Part II.B — what type of mobile application does the instruction ask you to design and build it as?", a:"A native mobile application."},
  {q:"Who is the course instructor and what is the credit value of CEC318?", a:"Prof. Melingui Melono R. L., PhD — Credit Value: 4."},
];

const mcqQuestions = [
  {
    q:"Which of the following is NOT an advantage of a mobile app over a mobile version of the company's website?",
    opts:["Full access to device hardware","Capability to interact with the service when disconnected from the network","Easier to update the content","More responsive and richer user interface experience"],
    correct:2,
    explain:"Websites update instantly for every user without needing a store release — that's a website advantage, so it's the one that does NOT belong to apps."
  },
  {
    q:"When an app needs to upload data, what should it do?",
    opts:["The app should immediately connect and transmit the data","The app should halt user interaction until the upload is completed","The app should cache the data until the user exits the app","The app should send the data asynchronously"],
    correct:3,
    explain:"Sending asynchronously means the app doesn't block the user while waiting on the network."
  },
  {
    q:"To reduce an app's drain on the battery, the app should do which of the following?",
    opts:["Never use any sensors","Monitor to determine whether a sensor reading needs an update before it 'uses' the sensor","Shut down all activity when an app is paused","B and C"],
    correct:3,
    explain:"Both listed strategies (sensor-check-before-use, and pausing activity) reduce battery drain — so the combined option is correct."
  },
  {
    q:"The proper lifecycle method to save app status is ____ in Android and ____ in iOS.",
    opts:["onPause, viewWillDisappear","onResume, viewWillAppear","onStopped, viewDidUnload","onDestroy, applicationDidEnterBackground"],
    correct:0,
    explain:"Android saves state in onPause as the activity leaves the foreground; iOS does the same in viewWillDisappear."
  },
  {
    q:"What is the difference between the Paused and Stopped states in the Android lifecycle?",
    opts:[
      "In the Stopped state, all hardware resources used by the app are automatically stopped. In the Paused state, they are stopped only if developer code tells them to stop",
      "In the Paused state, the activity is no longer visible. In the Stopped state, the activity's resources are reclaimed by the OS",
      "In the Paused state, the user can see but not interact with the activity. In the Stopped state, the activity is not visible",
      "There is no difference"
    ],
    correct:2,
    explain:"This is the exact wording pattern used in the paper's own answer options — Paused is visible-but-not-interactive, Stopped is not visible at all."
  },
];

const tfQuestions = [
  {n:"6.1", q:"Porting an existing application directly to a mobile platform is a good idea.", correct:false, explain:"False, per the paper's own phrasing — mobile constraints make a direct port unsuitable."},
  {n:"6.2", q:"Vertical scrolling is good for lists but should be used in a more limited fashion for other types of screen elements.", correct:true, explain:"True, as stated on the paper."},
  {n:"6.3", q:"Battery use is not a concern for all app developers.", correct:false, explain:"False — battery use IS a concern for all app developers."},
  {n:"6.4", q:"Differences in hardware capabilities are limited between devices.", correct:false, explain:"False — differences are significant, not limited."},
  {n:"6.5", q:"The usability of mobile devices is typically worse than a traditional computing device, such as a desktop computer.", correct:false, explain:"False, per the paper."},
];

// ---------------- RENDER: NAV ----------------
const navEl = document.getElementById('nav');
tabs.forEach((t,i)=>{
  const b = document.createElement('button');
  b.textContent = t.label;
  b.dataset.id = t.id;
  if(i===0) b.classList.add('active');
  b.onclick = ()=>switchTab(t.id);
  navEl.appendChild(b);
});
function switchTab(id){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('active', s.id===id));
}

const main = document.getElementById('main');

// ---------------- SECTION: NOTES (paper content only) ----------------
const notesSection = document.createElement('section');
notesSection.id = 'notes';
notesSection.className = 'active';
notesSection.innerHTML = `
  <div class="card">
    <span class="src">From: exam header</span>
    <h2>Exam details</h2>
    <ul>
      <li>College of Technology, University of Buea</li>
      <li>Second Semester Exam — Month: June — Time allowed: 2 hours</li>
      <li>Course: Introduction to Mobile App Dev — Code: CEC318 — Credit Value: 4</li>
      <li>Instructor: Melingui Melono R. L., PhD</li>
      <li>Part I: Comprehensive Questions (40 marks) = Exercise 1 (10) + Exercise 2 (30)</li>
      <li>Part II: Use Cases (30 marks) = A. Calculator (10) + B. Banking App essay (20)</li>
    </ul>
  </div>

  <div class="card">
    <span class="src">From: Exercise 1</span>
    <h2>MCQ answers (as covered by the paper's own options)</h2>
    <ul>
      <li><b>Q1</b> NOT an advantage of an app over a website: <i>easier to update content</i></li>
      <li><b>Q2</b> Uploading data: the app should <i>send the data asynchronously</i></li>
      <li><b>Q3</b> Reduce battery drain: <i>monitor sensor need before use, AND shut down activity when paused</i> (both B and C)</li>
      <li><b>Q4</b> Save app status: <i>onPause (Android)</i>, <i>viewWillDisappear (iOS)</i></li>
      <li><b>Q5</b> Paused vs Stopped: <i>Paused = visible but not interactive; Stopped = not visible</i></li>
    </ul>
  </div>

  <div class="card">
    <span class="src">From: Exercise 1, True/False</span>
    <h2>True/False (6.1–6.5)</h2>
    <ul>
      <li>6.1 Porting an app directly to mobile is a good idea — <b>False</b></li>
      <li>6.2 Vertical scrolling good for lists, limited for other elements — <b>True</b></li>
      <li>6.3 Battery use is not a concern for all developers — <b>False</b></li>
      <li>6.4 Hardware capability differences are limited between devices — <b>False</b></li>
      <li>6.5 Mobile usability is typically worse than desktop — <b>False</b></li>
    </ul>
  </div>

  <div class="card">
    <span class="src">From: Exercise 2 — Structured Questions (30 marks)</span>
    <h2>What the paper asks you to produce</h2>
    <ol>
      <li>Name 3 languages that can be used to develop a mobile application (3 marks)</li>
      <li>Cite and describe 3 cross-platform frameworks for mobile app development (6 marks)</li>
      <li>Briefly present the Android lifecycle (3 marks)</li>
      <li>Present the Android Architecture (5 marks)</li>
      <li>Explain the principal constraints when developing a mobile application (5 marks)</li>
      <li>Explain the difference between a StatefulWidget and a StatelessWidget (3 marks)</li>
      <li>Explain the roles of: <code>Scaffold()</code>, <code>runApp()</code>, <code>build()</code>, <code>FloatingActionButton()</code> (5 marks)</li>
    </ol>
    <p class="hint">Note: the paper asks the questions but does NOT supply model answers for these 7 items — you have to know the material. See your other, fuller guide for the actual content.</p>
  </div>

  <div class="card">
    <span class="src">From: Part II.A — Use Case (10 marks)</span>
    <h2>Console Calculator requirements, exactly as listed</h2>
    <ul>
      <li>Create a class <code>Calculator</code> with methods for addition, subtraction, multiplication, division. The class should have a constructor. (4 marks)</li>
      <li>The user should be able to select an operation by entering the corresponding number. (2 marks)</li>
      <li>The program must ask the user to enter two numbers, choose an operation, and display the results. (2 marks)</li>
      <li>Write the main function to instantiate a Calculator. Use a loop so the calculator continues running until the user chooses Exit(5). Handle invalid menu options appropriately. (2 marks)</li>
    </ul>
  </div>

  <div class="card">
    <span class="src">From: Part II.B — Mobile Application Architecture & Design (20 marks)</span>
    <h2>Banking App essay prompt, exactly as given</h2>
    <p><b>Project name:</b> The Banking App</p>
    <p><b>Project description (verbatim intent from the paper):</b> the app is designed to simplify financial transactions and improve accessibility to banking services. Traditional banking often requires visiting physical branches to check balances, transfer money, or pay bills. This app enables users to perform these activities anytime and anywhere using their smartphones.</p>
    <p><b>Instructions:</b> analyze the project and write a technical essay describing how you would design and build it as a <b>native mobile application</b>. Your description must cover:</p>
    <ul>
      <li>The app's core features</li>
      <li>User interface (UI) structure</li>
      <li>Data management</li>
      <li>Development workflow</li>
    </ul>
  </div>
`;
main.appendChild(notesSection);

// ---------------- SECTION: FLASHCARDS ----------------
const flashSection = document.createElement('section');
flashSection.id = 'flash';
let flashIdx = 0, flashShowingAnswer = false;
flashSection.innerHTML = `
  <div class="flash-wrap">
    <div class="flash-progress" id="flashProg"></div>
    <div class="flashcard" id="flashCard">
      <div class="face q show" id="flashQ"></div>
      <div class="face a" id="flashA"></div>
    </div>
    <p class="hint">Tap the card to flip</p>
    <div class="flash-controls">
      <button id="flashPrev">◀ Prev</button>
      <button id="flashShuffle">🔀 Shuffle</button>
      <button id="flashNext">Next ▶</button>
    </div>
  </div>
`;
main.appendChild(flashSection);

let flashOrder = flashcards.map((_,i)=>i);
function renderFlash(){
  const card = flashcards[flashOrder[flashIdx]];
  document.getElementById('flashQ').textContent = card.q;
  document.getElementById('flashA').textContent = card.a;
  document.getElementById('flashQ').classList.toggle('show', !flashShowingAnswer);
  document.getElementById('flashA').classList.toggle('show', flashShowingAnswer);
  document.getElementById('flashProg').textContent = `Card ${flashIdx+1} / ${flashcards.length}`;
}
document.getElementById('flashCard').onclick = ()=>{ flashShowingAnswer=!flashShowingAnswer; renderFlash(); };
document.getElementById('flashPrev').onclick = ()=>{ flashIdx=(flashIdx-1+flashOrder.length)%flashOrder.length; flashShowingAnswer=false; renderFlash(); };
document.getElementById('flashNext').onclick = ()=>{ flashIdx=(flashIdx+1)%flashOrder.length; flashShowingAnswer=false; renderFlash(); };
document.getElementById('flashShuffle').onclick = ()=>{
  for(let i=flashOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[flashOrder[i],flashOrder[j]]=[flashOrder[j],flashOrder[i]];}
  flashIdx=0; flashShowingAnswer=false; renderFlash();
};
renderFlash();

// ---------------- SECTION: MCQ QUIZ ----------------
const quizSection = document.createElement('section');
quizSection.id = 'quiz';
quizSection.innerHTML = `<div class="card" id="quizCard"></div>`;
main.appendChild(quizSection);

let qIdx = 0, qScore = 0, qAnswered = [];
function renderQuiz(){
  const card = document.getElementById('quizCard');
  if(qIdx >= mcqQuestions.length){
    card.innerHTML = `
      <div class="score-box">
        <div class="big">${qScore} / ${mcqQuestions.length}</div>
        <p>correct</p>
        <button class="opt" style="max-width:200px;margin:12px auto 0;text-align:center" id="quizRestart">Try again</button>
      </div>`;
    document.getElementById('quizRestart').onclick = ()=>{ qIdx=0; qScore=0; qAnswered=[]; renderQuiz(); };
    return;
  }
  const item = mcqQuestions[qIdx];
  const already = qAnswered[qIdx];
  card.innerHTML = `
    <div class="qprog">Question ${qIdx+1} / ${mcqQuestions.length} · Score: ${qScore}</div>
    <div class="qtext">${item.q}</div>
    <div id="optsWrap"></div>
    <div class="explain" id="explainBox">${item.explain}</div>
    <div class="quiz-nav">
      <button class="secondary" id="qPrev" ${qIdx===0?'disabled':''}>◀ Back</button>
      <button id="qNext">${qIdx===mcqQuestions.length-1?'Finish':'Next ▶'}</button>
    </div>
  `;
  const optsWrap = document.getElementById('optsWrap');
  item.opts.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='opt'; b.textContent = opt;
    if(already!==undefined){
      b.disabled = true;
      if(i===item.correct) b.classList.add('correct');
      else if(i===already) b.classList.add('wrong');
    }
    b.onclick = ()=>{
      if(qAnswered[qIdx]!==undefined) return;
      qAnswered[qIdx]=i;
      if(i===item.correct) qScore++;
      document.getElementById('explainBox').classList.add('show');
      renderQuiz();
    };
    optsWrap.appendChild(b);
  });
  if(already!==undefined) document.getElementById('explainBox').classList.add('show');
  document.getElementById('qNext').onclick = ()=>{ qIdx++; renderQuiz(); };
  document.getElementById('qPrev').onclick = ()=>{ qIdx--; renderQuiz(); };
}
renderQuiz();

// ---------------- SECTION: TRUE/FALSE ----------------
const tfSection = document.createElement('section');
tfSection.id = 'tf';
tfSection.innerHTML = `<div class="card" id="tfCard"></div>`;
main.appendChild(tfSection);

let tIdx=0, tScore=0, tAnswered=[];
function renderTf(){
  const card = document.getElementById('tfCard');
  if(tIdx >= tfQuestions.length){
    card.innerHTML = `
      <div class="score-box">
        <div class="big">${tScore} / ${tfQuestions.length}</div>
        <p>correct</p>
        <button class="opt" style="max-width:200px;margin:12px auto 0;text-align:center" id="tfRestart">Try again</button>
      </div>`;
    document.getElementById('tfRestart').onclick = ()=>{ tIdx=0; tScore=0; tAnswered=[]; renderTf(); };
    return;
  }
  const item = tfQuestions[tIdx];
  const already = tAnswered[tIdx];
  card.innerHTML = `
    <div class="qprog">Statement ${item.n} · ${tIdx+1} / ${tfQuestions.length} · Score: ${tScore}</div>
    <div class="qtext">${item.q}</div>
    <div id="tfOptsWrap"></div>
    <div class="explain" id="tfExplainBox">${item.explain}</div>
    <div class="quiz-nav">
      <button class="secondary" id="tPrev" ${tIdx===0?'disabled':''}>◀ Back</button>
      <button id="tNext">${tIdx===tfQuestions.length-1?'Finish':'Next ▶'}</button>
    </div>
  `;
  const wrap = document.getElementById('tfOptsWrap');
  [['True',true],['False',false]].forEach(([label,val])=>{
    const b = document.createElement('button');
    b.className='opt'; b.textContent = label;
    if(already!==undefined){
      b.disabled = true;
      if(val===item.correct) b.classList.add('correct');
      else if(val===already) b.classList.add('wrong');
    }
    b.onclick = ()=>{
      if(tAnswered[tIdx]!==undefined) return;
      tAnswered[tIdx]=val;
      if(val===item.correct) tScore++;
      document.getElementById('tfExplainBox').classList.add('show');
      renderTf();
    };
    wrap.appendChild(b);
  });
  if(already!==undefined) document.getElementById('tfExplainBox').classList.add('show');
